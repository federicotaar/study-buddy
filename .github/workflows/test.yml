name: Study Buddy tests
on:
  push:
    paths: ["app.js", "tests/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["app.js", "tests/**", ".github/workflows/test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node tests/app.test.js
